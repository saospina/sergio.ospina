name: Deploy to GitHub Pages

# Deploys only when a PR is merged into master. The trigger is the push the
# merge creates (refs/heads/master, which the github-pages environment allows),
# and the merged-pr job stops any push that did not come from a merged PR.
# Do not switch to pull_request (refs/pull/<n>/merge is rejected) or back to
# pull_request_target (restricted on public repos from 2026-12-02).
on:
  push:
    branches: [master]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # The Master ruleset already requires PRs; this is the explicit guarantee.
  merged-pr:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      number: ${{ steps.lookup.outputs.number }}
    steps:
      - name: Find the merged PR for this commit
        id: lookup
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          number=$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/pulls" --jq \
            "[.[] | select(.merged_at != null and .base.ref == \"master\" and .merge_commit_sha == \"$GITHUB_SHA\") | .number] | first // empty")
          if ! [[ "$number" =~ ^[0-9]+$ ]]; then
            number=""
            echo "::notice::$GITHUB_SHA is not the merge commit of a PR into master; skipping deploy."
          else
            echo "Deploying merged PR #$number"
          fi
          echo "number=$number" >> "$GITHUB_OUTPUT"

  build:
    needs: merged-pr
    if: needs.merged-pr.outputs.number != ''
    runs-on: ubuntu-latest
    steps:
      - name: Check out master
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Build Astro site
        run: npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./dist

  # A separate job only starts after the artifact is fully finalized, which
  # avoids the "No artifacts named github-pages" race seen in a single job.
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
