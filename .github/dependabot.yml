version: 2
updates:
  # Minor and patch bumps arrive as one grouped PR a week; majors (e.g. Astro)
  # get their own PR. The cooldown skips releases younger than a week, which
  # avoids picking up a compromised or quickly-yanked version.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    ignore:
      # @astrojs/check (0.9.x) peers on TypeScript ^5 || ^6; drop this once it
      # supports 7, or `npm ci` fails with ERESOLVE.
      - dependency-name: typescript
        update-types: ['version-update:semver-major']
      # Types must match the Node version CI and deploy run (24).
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
    groups:
      npm-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ['*']
